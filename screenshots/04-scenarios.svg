    <text x="124" y="312" fill="#F5F7FB" font-family="Arial, sans-serif" font-size="28" font-weight="700">Protect the quarter</text>
    <text x="124" y="362" fill="#B8C7D7" font-family="Arial, sans-serif" font-size="22">Prioritize forecast confidence and suppress avoidable operating variance.</text>
    <text x="124" y="438" fill="#EEF4FB" font-family="Arial, sans-serif" font-size="22">• Commit confidence +6 pts</text>
    <text x="124" y="478" fill="#EEF4FB" font-family="Arial, sans-serif" font-size="22">• Promotion only on proven lanes</text>
  </g>
  <g>
    <rect x="506" y="260" width="388" height="270" rx="24" fill="#172328" stroke="#30444A"/>
    <text x="538" y="312" fill="#F5F7FB" font-family="Arial, sans-serif" font-size="28" font-weight="700">Accelerate growth</text>
    <text x="538" y="362" fill="#B8C7D7" font-family="Arial, sans-serif" font-size="22">Push validated pricing, experimentation, and attribution improvements harder.</text>
    <text x="538" y="438" fill="#EEF4FB" font-family="Arial, sans-serif" font-size="22">• Qualified pipeline +11%</text>
    <text x="538" y="478" fill="#EEF4FB" font-family="Arial, sans-serif" font-size="22">• Better partner and paid clarity</text>
  </g>
  <g>
    <rect x="920" y="260" width="388" height="270" rx="24" fill="#172328" stroke="#30444A"/>
    <text x="952" y="312" fill="#F5F7FB" font-family="Arial, sans-serif" font-size="28" font-weight="700">Reduce governance drag</text>
    <text x="952" y="362" fill="#B8C7D7" font-family="Arial, sans-serif" font-size="22">Close risk bottlenecks so teams move faster without opening new exposure.</text>
    <text x="952" y="438" fill="#EEF4FB" font-family="Arial, sans-serif" font-size="22">• Approval cycle time -18%</text>
    <text x="952" y="478" fill="#EEF4FB" font-family="Arial, sans-serif" font-size="22">• Exception aging under target</text>
