  <rect x="92" y="584" width="1216" height="180" rx="24" fill="#172328" stroke="#30444A"/>
  <text x="124" y="628" fill="#8EF2C0" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">ACTION QUEUE</text>
  <text x="124" y="682" fill="#F5F7FB" font-family="Arial, sans-serif" font-size="28" font-weight="700">Pricing rollout decision · Vendor-risk renewal block · AI release approval · Funnel follow-up rebalance</text>
  <text x="124" y="726" fill="#B8C7D7" font-family="Arial, sans-serif" font-size="22">Cross-domain work is visible in one queue so operators do not solve the right problems in the wrong order.</text>
